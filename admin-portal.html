<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioLearn Admin</title>

<style>
body{font-family:Arial;background:#f4f7f5;margin:0}
.sidebar{width:220px;position:fixed;top:0;bottom:0;background:#0e1a14;color:#fff;padding:20px}
.sidebar div{padding:10px;cursor:pointer}
.main{margin-left:230px;padding:20px}
.page{display:none}
.page.active{display:block}

.card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
.btn{padding:8px 12px;border:none;cursor:pointer}
.btn-primary{background:green;color:#fff}
.btn-danger{background:red;color:#fff}
.btn-secondary{background:#ddd}
input,textarea,select{width:100%;padding:8px;margin-top:5px;margin-bottom:10px}

table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #ddd;padding:8px}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
<h3>BioLearn Admin</h3>
<div onclick="nav('dashboard')">Dashboard</div>
<div onclick="nav('questions')">Questions</div>
<div onclick="nav('notes')">Notes</div>
<div onclick="nav('tests')">Tests</div>
<div onclick="nav('resources')">Resources</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- DASHBOARD -->
<div class="page active" id="dashboard">
<h2>Dashboard</h2>
<div class="card" id="stats"></div>
</div>

<!-- QUESTIONS -->
<div class="page" id="questions">
<h2>Questions</h2>
<button class="btn btn-primary" onclick="openQ()">Add Question</button>
<button class="btn btn-secondary" onclick="openBulk()">Paste PDF Questions</button>

<div class="card">
<table>
<thead><tr><th>Question</th><th>Answer</th><th>Action</th></tr></thead>
<tbody id="qList"></tbody>
</table>
</div>
</div>

<!-- NOTES -->
<div class="page" id="notes">
<h2>Notes</h2>
<button class="btn btn-primary" onclick="openN()">Add Note</button>
<div id="nList"></div>
</div>

<!-- TESTS -->
<div class="page" id="tests">
<h2>Tests</h2>
<button class="btn btn-primary" onclick="openT()">Create Test</button>
<div id="tList"></div>
</div>

<!-- RESOURCES -->
<div class="page" id="resources">
<h2>Resources (PDF / PPT)</h2>

<div class="card">
<input id="rTitle" placeholder="Title">
<select id="rClass"></select>
<input type="file" id="rFile" accept=".pdf,.ppt,.pptx">
<button class="btn btn-primary" onclick="uploadRes()">Upload</button>
</div>

<div id="rList"></div>
</div>

</div>

<!-- MODALS -->
<div id="qModal" class="page">
<div class="card">
<h3>Question</h3>
<textarea id="qText"></textarea>
<input id="qAns" placeholder="Correct answer index (0-3)">
<button onclick="saveQ()" class="btn btn-primary">Save</button>
</div>
</div>

<div id="bulkModal" class="page">
<div class="card">
<h3>Paste PDF Questions</h3>
<textarea id="bulkText" style="height:200px"></textarea>
<button onclick="importBulk()" class="btn btn-primary">Import</button>
</div>
</div>

<script>

/* ================= DB ================= */
const DB={
q:JSON.parse(localStorage.getItem('q')||'[]'),
n:JSON.parse(localStorage.getItem('n')||'[]'),
t:JSON.parse(localStorage.getItem('t')||'[]'),
r:JSON.parse(localStorage.getItem('r')||'[]'),

save(){
localStorage.setItem('q',JSON.stringify(this.q));
localStorage.setItem('n',JSON.stringify(this.n));
localStorage.setItem('t',JSON.stringify(this.t));
localStorage.setItem('r',JSON.stringify(this.r));
}
};

/* ================= NAV ================= */
function nav(p){
document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
document.getElementById(p).classList.add('active');
if(p==='questions')renderQ();
if(p==='notes')renderN();
if(p==='tests')renderT();
if(p==='resources')renderR();
}

/* ================= QUESTIONS ================= */
function renderQ(){
document.getElementById('qList').innerHTML=DB.q.map((q,i)=>
`<tr>
<td>${q.text}</td>
<td>${q.answer}</td>
<td><button onclick="delQ(${i})" class="btn btn-danger">X</button></td>
</tr>`).join('');
}

function openQ(){
const t=prompt("Question:");
const a=prompt("Answer index:");
if(t){DB.q.push({text:t,answer:a});DB.save();renderQ();}
}

function delQ(i){DB.q.splice(i,1);DB.save();renderQ();}

/* ================= BULK IMPORT ================= */
function openBulk(){
document.getElementById('bulkModal').classList.add('active');
}

function importBulk(){
const lines=document.getElementById('bulkText').value.split('\n');
lines.forEach(l=>{
const p=l.split('|');
if(p.length>=3){
DB.q.push({text:p[0],options:p[1],answer:p[2]});
}
});
DB.save();
renderQ();
alert("Imported");
}

/* ================= NOTES ================= */
function openN(){
const t=prompt("Note title:");
const c=prompt("Content:");
if(t){DB.n.push({t,c});DB.save();renderN();}
}

function renderN(){
document.getElementById('nList').innerHTML=
DB.n.map(n=>`<div class="card"><b>${n.t}</b><p>${n.c}</p></div>`).join('');
}

/* ================= TESTS ================= */
function openT(){
const t=prompt("Test title:");
if(t){DB.t.push({t});DB.save();renderT();}
}

function renderT(){
document.getElementById('tList').innerHTML=
DB.t.map(t=>`<div class="card">${t.t}</div>`).join('');
}

/* ================= RESOURCES ================= */
function renderR(){
document.getElementById('rList').innerHTML=
DB.r.map((r,i)=>
`<div class="card">
<b>${r.title}</b> (${r.class})<br>
<a href="${r.file}" download>Download</a>
<button onclick="delR(${i})" class="btn btn-danger">Delete</button>
</div>`).join('');
}

function uploadRes(){
const f=document.getElementById('rFile').files[0];
const t=document.getElementById('rTitle').value;
const c=document.getElementById('rClass').value;

const reader=new FileReader();
reader.onload=()=>{
DB.r.push({title:t,class:c,file:reader.result});
DB.save();
renderR();
};
reader.readAsDataURL(f);
}

function delR(i){DB.r.splice(i,1);DB.save();renderR();}

/* INIT */
document.getElementById('rClass').innerHTML=
['JSS1','JSS2','JSS3','SS1','SS2','SS3']
.map(c=>`<option>${c}</option>`).join('');

renderQ();

</script>

</body>
</html>
