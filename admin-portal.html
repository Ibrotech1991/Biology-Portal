<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioLearn Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--green:#1a6b3c;
--amber:#e8a020;
--dark:#0e1a14;
--border:#d0e8d9;
--muted:#6b8a74;
--danger:#c0392b;
--sidebar:240px;
}

body{
font-family:'DM Sans',sans-serif;
background:#f2f8f4;
}

/* LOGIN */
#loginScreen{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
background:#f5fbf7;
}

.login-box{
width:380px;
padding:30px;
background:#fff;
border-radius:15px;
border:1px solid var(--border);
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid var(--border);
border-radius:8px;
outline:none;
}

button{
padding:10px;
border:none;
cursor:pointer;
border-radius:8px;
font-weight:bold;
}

.btn-primary{background:var(--green);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-amber{background:var(--amber);color:#fff}

/* APP */
#app{display:none}

.sidebar{
position:fixed;
top:0;left:0;
width:var(--sidebar);
height:100%;
background:var(--dark);
color:#fff;
padding:20px;
overflow:auto;
}

.nav-item{
padding:12px;
cursor:pointer;
margin:5px 0;
border-radius:6px;
}

.nav-item:hover,.nav-item.active{
background:rgba(255,255,255,.1);
}

.main{
margin-left:var(--sidebar);
padding:20px;
}

.page{display:none}
.page.active{display:block}

.card{
background:#fff;
padding:15px;
border-radius:10px;
margin-bottom:15px;
border:1px solid var(--border);
}

.question{
padding:10px;
border-bottom:1px solid #eee;
}

.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

@media(max-width:800px){
.sidebar{position:relative;width:100%;height:auto}
.main{margin-left:0}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>BioLearn Admin</h2>

<label>Username</label>
<input id="username">

<label>Password</label>
<input type="password" id="password">

<br><br>
<button class="btn-primary" onclick="login()">Login</button>
<p id="error" style="color:red"></p>
</div>
</div>

<!-- APP -->
<div id="app">

<div class="sidebar">
<h3>BioLearn</h3>

<div class="nav-item active" onclick="showPage('dashboard')">Dashboard</div>
<div class="nav-item" onclick="showPage('questions')">Questions</div>
<div class="nav-item" onclick="showPage('notes')">Notes</div>
<div class="nav-item" onclick="showPage('tests')">Tests</div>
</div>

<div class="main">

<!-- DASHBOARD -->
<div class="page active" id="dashboard">
<h2>Dashboard</h2>

<div class="card">
Total Questions: <span id="qCount">0</span>
</div>

<div class="card">
Recent Questions
<div id="recent"></div>
</div>
</div>

<!-- QUESTIONS -->
<div class="page" id="questions">

<div class="card">
<h3>Add Question</h3>

<input id="qText" placeholder="Question">

<input id="optA" placeholder="Option A">
<input id="optB" placeholder="Option B">
<input id="optC" placeholder="Option C">
<input id="optD" placeholder="Option D">

<select id="ans">
<option value="0">A</option>
<option value="1">B</option>
<option value="2">C</option>
<option value="3">D</option>
</select>

<br><br>
<button class="btn-primary" onclick="addQuestion()">Save</button>
</div>

<div class="card">
<h3>All Questions</h3>
<div id="qList"></div>
</div>

</div>

<!-- NOTES -->
<div class="page" id="notes">
<div class="card">
<h3>Add Note</h3>

<input id="noteTitle" placeholder="Title">
<textarea id="noteBody" placeholder="Content"></textarea>

<br>
<button class="btn-primary" onclick="addNote()">Save</button>
</div>

<div id="noteList"></div>
</div>

</div>
</div>

<script>
const ADMIN_USER="admin";
const ADMIN_PASS="1234";

function login(){
let u=document.getElementById("username").value;
let p=document.getElementById("password").value;

if(u===ADMIN_USER && p===ADMIN_PASS){
localStorage.setItem("biolearn","true");
startApp();
}else{
document.getElementById("error").innerText="Invalid login";
}
}

function startApp(){
document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";
loadAll();
}

if(localStorage.getItem("biolearn")=="true"){
startApp();
}

function showPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

function get(k){return JSON.parse(localStorage.getItem(k)||"[]")}
function set(k,v){localStorage.setItem(k,JSON.stringify(v))}
function id(){return Date.now()}

function addQuestion(){
let data=get("questions");

data.push({
id:id(),
q:document.getElementById("qText").value,
a:[
document.getElementById("optA").value,
document.getElementById("optB").value,
document.getElementById("optC").value,
document.getElementById("optD").value
],
ans:document.getElementById("ans").value
});

set("questions",data);
loadAll();
}

function delQ(i){
let d=get("questions");
d=d.filter(x=>x.id!==i);
set("questions",d);
loadAll();
}

function addNote(){
let d=get("notes");
d.push({
id:id(),
t:document.getElementById("noteTitle").value,
b:document.getElementById("noteBody").value
});
set("notes",d);
loadAll();
}

function loadAll(){

let q=get("questions");
document.getElementById("qCount").innerText=q.length;

document.getElementById("qList").innerHTML=q.map(x=>
`<div class="question">
<b>${x.q}</b><br>
A:${x.a[0]} B:${x.a[1]} C:${x.a[2]} D:${x.a[3]}
<br>
<button class="btn-danger" onclick="delQ(${x.id})">Delete</button>
</div>`
).join("");

document.getElementById("recent").innerHTML=q.slice(-3).map(x=>
`<div>${x.q}</div>`
).join("");

let n=get("notes");
document.getElementById("noteList").innerHTML=n.map(x=>
`<div class="card"><b>${x.t}</b><br>${x.b}</div>`
).join("");
}

</script>

</body>
</html>
